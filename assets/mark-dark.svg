<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="webscour">
  <title>webscour</title>
  <!-- A page of cells, combed clean along one diagonal. Four cells on that diagonal are drawn as
       blades instead of blocks, which is the whole idea: the grid is what is being read, the
       diagonal is what is scraping it. No text, no gradient, no rounded corner. -->
  <g fill="#e6edf3">
    <rect x="4" y="36" width="24" height="24"/>
    <rect x="4" y="68" width="24" height="24"/>
    <rect x="4" y="100" width="24" height="24"/>
    <rect x="36" y="4" width="24" height="24"/>
    <rect x="36" y="68" width="24" height="24"/>
    <rect x="36" y="100" width="24" height="24"/>
    <rect x="68" y="4" width="24" height="24"/>
    <rect x="68" y="36" width="24" height="24"/>
    <rect x="68" y="100" width="24" height="24"/>
    <rect x="100" y="4" width="24" height="24"/>
    <rect x="100" y="36" width="24" height="24"/>
    <rect x="100" y="68" width="24" height="24"/>
  </g>
  <g stroke="#e6edf3" stroke-width="7" stroke-linecap="butt" fill="none">
    <path d="M4 26 L26 4"/>
    <path d="M36 58 L58 36"/>
    <path d="M68 90 L90 68"/>
    <path d="M100 122 L122 100"/>
  </g>
</svg>
