<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64" role="img" aria-label="webscour">
  <title>webscour</title>
  <!-- The mark on the left, a grid scraped along one diagonal, with the name set beside it. The
       name is drawn as paths, not as a font: no font-family, no embedded face, so the file renders
       identically wherever it is opened. -->
