    <rect x="0" y="30" width="10" height="10"/>
    <rect x="0" y="44" width="10" height="10"/>
    <rect x="14" y="2" width="10" height="10"/>
    <rect x="14" y="30" width="10" height="10"/>
    <rect x="14" y="44" width="10" height="10"/>
    <rect x="28" y="2" width="10" height="10"/>
    <rect x="28" y="16" width="10" height="10"/>
    <rect x="28" y="44" width="10" height="10"/>
    <rect x="42" y="2" width="10" height="10"/>
    <rect x="42" y="16" width="10" height="10"/>
    <rect x="42" y="30" width="10" height="10"/>
  </g>
  <g stroke="#1f2328" stroke-width="3" stroke-linecap="butt" fill="none">
    <path d="M0 11 L11 0"/>
    <path d="M14 25 L25 14"/>
    <path d="M28 39 L39 28"/>
    <path d="M42 53 L53 42"/>
  </g>
  <g fill="none" stroke="#1f2328" stroke-width="5.5" stroke-linecap="butt" stroke-linejoin="miter" transform="translate(66 32)">
