[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "webscour"
dynamic = ["version"]
description = "One keyless CLI for web search, page text, PDFs, sitemaps and a polite crawl"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Furkan Cevik" }]
keywords = ["cli", "search", "web", "scraper", "pdf", "searxng", "crawler"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Utilities",
]
# No runtime dependencies, by design: the standard library and the system binaries named in the
# README (lightpanda, and optionally pdftotext / pandoc / markitdown) are the whole stack. The
# optional playwright fallback lives in a venv this tool owns (`wsc setup --playwright`), which
# is why it is not an extra: an extra would install it into the user's own environment.
dependencies = []

[project.scripts]
wsc = "webscour.cli:main"

[project.urls]
Homepage = "https://github.com/FurBlood344324/webscour"
Issues = "https://github.com/FurBlood344324/webscour/issues"

[tool.setuptools]
packages = ["webscour"]
include-package-data = false

[tool.setuptools.dynamic]
# The one version in the tree. `scripts/check.sh` fails when the tag, this attribute and the pi
# manifest disagree, so a release cannot ship two different numbers.
version = { attr = "webscour.__version__" }

[tool.setuptools.data-files]
# The SearXNG installer is data, not a Python module: it is meant to be read and run by hand.
"share/webscour/searx" = [
  "searx/install.sh",
  "searx/serve.py",
  "searx/probe-engines.py",
  "searx/README.md",
]

[tool.ruff]
# 3.11 is the floor, so `tomllib`, `X | Y` and `str.removeprefix` are always available, and the
# linter is told so rather than guessing from a habit nobody has any more.
target-version = "py311"
line-length = 100
src = ["webscour", "tests"]
# `searx/` is data shipped for a human to read and run, not a package module: it is not
# installed, not imported, and linting it would invite edits nobody asked for.
extend-exclude = ["searx", "build", "dist", ".venv", ".venv-dev"]

[tool.ruff.format]
# A docstring is prose and is wrapped by hand, not by the formatter.
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",   # line length is the formatter's job, and long URLs are not a defect
  "B008",   # a default that calls a function is fine for `bins=BACKEND_BINS`
  "SIM105", # `contextlib.suppress` reads worse than the try/except it replaces here
  "UP031",  # `%` formatting is what this codebase reads best; f-strings are not a rule here
  "RUF001", # an ellipsis and a middle dot are deliberate in output strings
]
