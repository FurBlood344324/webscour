# Dependabot

# Two ecosystems, and neither one is the runtime.
#
# `webscour` has `dependencies = []`: the standard library plus the system binaries named in the
# README. So the `pip` entry below has nothing to update in the package itself. What it does
# update is the dev toolchain the gate needs (ruff, build, twine), which lives in `.venv-dev` on
# a workstation and is installed by each workflow. A bump there is real work: a new ruff can
# start failing `ruff check .` on code nobody touched, and that is a person's decision, not a
# merge button's.
#
# Groups are one per ecosystem on purpose. Three separate pull requests for three dev tools is
# three times the gate run for one afternoon's pin bump.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-tools:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
