# Dependabot

# Two ecosystems, and neither one is the runtime.
#
# The crate has four direct dependencies (ureq, serde_json, scraper, roxmltree), so a `cargo` bump
# is real work: a new minor can move a parser or the JSON bytes, and `cargo test` is what decides.
# The `github-actions` entry keeps the pinned actions current.
#
# Groups are one per ecosystem on purpose. Two separate pull requests for two ecosystems is twice
# the gate run for one afternoon's pin bump.

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      crates:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
