# A wrapper, like ci.yml: the version check and the publish decisions live in scripts/, so a laptop
# can rehearse the same steps. Nothing here decides what "correct" means.
#
# npm publishing uses OIDC trusted publishing, the same shape PyPI uses: the package trusts this
# repository and this workflow file, GitHub mints a short-lived token, and no secret is stored. That
# is why `id-token: write` is granted and why no NODE_AUTH_TOKEN appears below. A token in a secret
# would be a second copy of the permission, and the copy is the one that goes stale.
name: npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write   # OIDC to npm: no token secret anywhere

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or later; the one bundled with Node 22 is older, and
      # the older client falls back to looking for a token, which is exactly the failure this
      # workflow exists to avoid.
      - name: npm new enough for OIDC
        run: |
          npm install -g npm@^11.5.1
          npm --version

      # The same rule as the PyPI release: the tag is the promise, and the package is the copy.
      # A tag that disagrees with package.json publishes nothing.
      - name: the tag is the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json $pkg" >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches package.json $pkg"

      - name: the skill can be resolved from the package
        run: |
          # The npm package ships SKILL.md plus its references; if the path in `pi.skills` is
          # wrong, `pi install npm:webscour` silently installs nothing. Fail here instead.
          node -e '
            const p = require("./package.json");
            const fs = require("node:fs");
            const paths = [].concat(p.pi?.skills ?? [], p.files ?? []);
            for (const rel of paths) {
              const abs = rel.replace(/^\.\//, "");
              if (!fs.existsSync(abs)) { console.error("missing: " + abs); process.exit(1); }
            }
            if (!p.skills || !p.skills.includes("npm:webscour")) {
              console.error("package.json must declare skills: [\"npm:webscour\"]");
              process.exit(1);
            }
            console.log("skill paths resolve");
          '

      - name: publish
        run: |
          # --provenance ties the tarball to this workflow run. Authentication comes from the OIDC
          # exchange: with no NODE_AUTH_TOKEN set, npm asks GitHub for an identity token and the
          # registry checks it against the trusted publisher configured for this package.
          npm publish --provenance --access public
