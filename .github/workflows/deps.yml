# A wrapper. The checks live in scripts/deps-check.sh. Weekly, read-only, opens an issue and never
# changes code: a dependency that still resolves is not permission to upgrade it, and a broken
# one is a decision for a human.
name: deps

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deps:
    name: pinned actions and lightpanda's CLI surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: ./scripts/deps-check.sh
        id: deps
        continue-on-error: true
        run: ./scripts/deps-check.sh

      - name: open an issue when something drifted
        if: steps.deps.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="deps: a pinned action or the lightpanda CLI changed shape"
          if gh issue list --state open --search "$title in:title" | grep -q .; then
            echo "an issue is already open; not opening a second one"
            exit 0
          fi
          gh issue create --title "$title" --body-file .agent-out/deps-check.txt
