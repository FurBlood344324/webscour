# A wrapper. The checks live in scripts/check.sh; this file only chooses a Python version and
# runs it. Nothing here decides what "passing" means, and no check exists only in CI.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # setuptools is a build requirement, not a dev tool: pyproject.toml declares
      # requires = ["setuptools>=77"] and `build --no-isolation` reads the backend from the
      # running environment instead of provisioning it. Python 3.12 and later do not ship
      # setuptools in a fresh environment, so without this line the gate fails on two of the
      # three matrix entries while passing on the third, which is the worst kind of red.
      - name: install the dev tools the gate needs
        run: python -m pip install --upgrade pip ruff build twine "setuptools>=77"

      # One command. If this line grows arguments, the argument belongs in the script.
      - name: ./scripts/check.sh
        run: ./scripts/check.sh

  build:
    # The wheel a release reuses. `check.sh` builds one; this job keeps it as an artifact so
    # release.yml never has to trust a rebuild on a different machine.
    name: build (wheel + sdist)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 90
          if-no-files-found: error
