# A wrapper. The checks live in scripts/check.sh; publishing is PyPI's trusted publishing and the
# only logic here is "the tag and the package agree, or nothing ships".
#
# There is no API token in this file and no secret to rotate. PyPI trusts this repository and this
# environment through OIDC, which is why `id-token: write` is granted below and why the job runs in
# the `pypi` environment: that environment is the second factor, and it can require a reviewer.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: tag matches __version__
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: ./scripts/check.sh
        run: |
          python -m pip install --upgrade pip ruff build twine
          ./scripts/check.sh

      - name: the tag is the version
        run: ./scripts/check-tag.sh "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC to PyPI: no token secret anywhere
      contents: write   # create the GitHub Release
    steps:
      - uses: actions/checkout@v7

      # The wheel that passed the gate, not a rebuild. A rebuild can differ (a dirty tree, a
      # different setuptools) and then the artifact that was tested is not the artifact shipped.
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: publish
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: GitHub Release body from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/changelog-section.sh "v${GITHUB_REF_NAME#v}" > /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "webscour ${GITHUB_REF_NAME#v}" \
            --notes-file /tmp/notes.md
